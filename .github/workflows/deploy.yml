name: Deploy to GitHub Pages

# StructuralSketcher es un único index.html autocontenido (sin build, sin
# dependencias): este workflow solo lo publica tal cual en Pages.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check inline script syntax
        run: |
          sed -n '/<script>/,/<\/script>/p' index.html | sed '1d;$d' > /tmp/inline.js
          node --check /tmp/inline.js
      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
